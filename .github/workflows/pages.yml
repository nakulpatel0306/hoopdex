name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pick up last night's games each morning (US Eastern)
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # Box scores fetched on earlier runs, so each run only fetches new games
      - uses: actions/cache@v4
        with:
          path: public/games.json
          key: games-${{ github.run_id }}
          restore-keys: games-
      # If Basketball-Reference is unreachable, deploy with the games already saved
      - run: bun scripts/games.ts
        continue-on-error: true
      - run: bun run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy step needs to publish to Pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
